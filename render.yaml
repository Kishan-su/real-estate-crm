services:
  - type: web
    name: estateflow-crm
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: estateflow-db
          property: connectionString
      - key: DEMO_ADMIN_USERNAME
        value: admin
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_SALES_USERNAME
        value: sales1
      - key: DEMO_SALES_PASSWORD
        sync: false

databases:
  - name: estateflow-db
    plan: free
